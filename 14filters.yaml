- name: identify filters
  hosts: localhost
  connection: local
  # vars:
  #   person: laude
  tasks:
    - name: filters
      ansible.builtin.debug:
        msg: "kyaa re {{ person | default ('RANDI')}}"


    - name: convert string to fruits
      vars:
        fruits: "roma,aroma,varoma"
      ansible.builtin.debug:
        msg: "list of fruits: {{fruits | split (',') }}"
      
    - name: convert list into map
      vars:
        course:
          name: coda
          duration: 120days
          trainer: modi
      ansible.builtin.debug:
          msg: "dictionary format to map  is: {{course | dict2items}}"
          
    - name: convert map to list
  hosts: localhost
  connection: local
  vars:
    course:
      - { key: 'name', value: 'coda' }
      - { key: 'duration', value: '120days' }
      - { key: 'trainer', value: 'modi' }
  tasks:
    - name: course info structure
      ansible.builtin.debug:
        msg: "course info structure : {{ course | items2dict }}"


    - name: convert to lower
  hosts: localhost
  connection: local
  vars:
    name: "HELLO RE GANDU KAISA HAI"
  tasks:
    - name: lower case conversion
      ansible.builtin.debug:
        msg: "lower case is {{ name | lower }}"
      
    - name: convert to upper
  hosts: localhost
  connection: local
  vars:
    name: "hello re ganu kaise hai re"
  tasks:
    - name: upper case conversion
      ansible.builtin.debug:
        msg: "lower case is {{ name | upper }}"

    - name: print minnimum and maximum
      vars:
        NUMBERS: [3,4,5,6665,9098,332210,40,-4]
      ansible.builtin.debug:
        msg: "minnimum number is: {{ NUMBERS | min }} , maximum number is : {{NUMBERS | max}}"    

    - name: check for valid ip address
      vars:
        address: "192.168.0.1"
      ansible.builtin.debug:
        msg: "{{ address | ansible.utils.ipaddr }}"


  
