---
- name: Display student details
  hosts: localhost
  connection: local
  gather_facts: no

  vars_files:
    - students.yaml

  tasks:
    - name: Print all students' details
      ansible.builtin.debug:
        var: students

    - name: Print formatted student info
      ansible.builtin.debug:
        msg: |
          Student Name: {{ item.name }}
          Phone Number: {{ item.phone_number }}
          Permanent Address: {{ item.permanent_address.house_no }}, {{ item.permanent_address.street }}, {{ item.permanent_address.city }}, {{ item.permanent_address.state }} - {{ item.permanent_address.pincode }}
          Temporary Address: {{ item.temporary_address.house_no }}, {{ item.temporary_address.street }}, {{ item.temporary_address.city }}, {{ item.temporary_address.state }} - {{ item.temporary_address.pincode }}
      loop: "{{ students }}"
