---
- name: Display student details in a readable format
  hosts: localhost
  connection: local
  gather_facts: no

  vars_files:
    - students.yaml

  tasks:
    - name: Print formatted student info (pretty output)
      ansible.builtin.debug:
        msg: |
          ----------------------------------------
          🎓 Student Details
          ----------------------------------------
          👤 Name            : {{ item.name }}
          📞 Phone Number    : {{ item.phone_number }}

          🏠 Permanent Address
              House No  : {{ item.permanent_address.house_no }}
              Street    : {{ item.permanent_address.street }}
              City      : {{ item.permanent_address.city }}
              State     : {{ item.permanent_address.state }}
              Pincode   : {{ item.permanent_address.pincode }}

          🏡 Temporary Address
              House No  : {{ item.temporary_address.house_no }}
              Street    : {{ item.temporary_address.street }}
              City      : {{ item.temporary_address.city }}
              State     : {{ item.temporary_address.state }}
              Pincode   : {{ item.temporary_address.pincode }}
          ----------------------------------------
      loop: "{{ students }}"
