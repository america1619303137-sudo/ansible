---
- name: Compare user-entered number with default value
  hosts: localhost
  connection: local

  vars:
    default_number: 50

  vars_prompt:
    - name: user_number
      prompt: "Enter a number"
      private: false

  tasks:
    - name: Display both numbers
      ansible.builtin.debug:
        msg: "Default number = {{ default_number }}, User entered = {{ user_number }}"

    - name: When user number is greater
      ansible.builtin.debug:
        msg: "Your number ({{ user_number }}) is greater than the default ({{ default_number }})"
      when: user_number | int > default_number

    - name: When user number is less
      ansible.builtin.debug:
        msg: "Your number ({{ user_number }}) is less than the default ({{ default_number }})"
      when: user_number | int < default_number

    - name: When numbers are equal
      ansible.builtin.debug:
        msg: "Your number ({{ user_number }}) is equal to the default ({{ default_number }})"
      when: user_number | int == default_number
